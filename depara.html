<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#C8B091">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="De-Para — Sonho dos Pés">
    <meta name="description" content="Auditoria de estoque esperada vs contada — Sonho dos Pés">

    <title>Sonho dos Pés — Auditoria De-Para</title>

    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/svg+xml" href="assets/logo.svg">
    <link rel="apple-touch-icon" href="assets/logo.svg">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/styles.css">
    <style>
        .depara-container {
            padding: 16px;
            max-width: 600px;
            margin: 0 auto;
        }

        .back-nav {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: #7A6B5C;
            text-decoration: none;
            font-weight: 500;
            font-size: 0.9rem;
        }

        /* CARD DE SELEÇÃO DE INVENTÁRIO CUSTOMIZADO */
        .session-selector-card {
            background: linear-gradient(135deg, #FFFFFF 0%, #FDFAF5 100%);
            border-radius: 18px;
            padding: 16px 20px;
            box-shadow: 0 4px 20px rgba(200, 176, 145, 0.15);
            border: 1px solid rgba(200, 176, 145, 0.35);
            margin-bottom: 16px;
        }

        .session-select-label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #A88B65;
            margin-bottom: 8px;
        }

        .select-wrapper {
            position: relative;
            width: 100%;
        }

        .session-select {
            width: 100%;
            padding: 12px 40px 12px 16px;
            border-radius: 12px;
            border: 1px solid #E8DFD1;
            background: #FFFFFF;
            color: #2B2118;
            font-size: 0.95rem;
            font-weight: 600;
            outline: none;
            cursor: pointer;
            appearance: none;
            -webkit-appearance: none;
            -moz-appearance: none;
            box-shadow: 0 2px 6px rgba(43, 33, 24, 0.04);
            transition: all 0.2s ease;
        }

        .session-select:focus, .session-select:hover {
            border-color: #C8B091;
            box-shadow: 0 0 0 3px rgba(200, 176, 145, 0.18);
        }

        .select-arrow {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            pointer-events: none;
            color: #A88B65;
        }

        /* SUMMARY CARDS (RESUMO ESTAÍSTICO) */
        .summary-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 16px;
        }

        .summary-card {
            background: #FFFFFF;
            border-radius: 14px;
            padding: 12px 8px;
            text-align: center;
            box-shadow: 0 2px 12px rgba(43, 33, 24, 0.04);
            border: 1px solid rgba(200, 176, 145, 0.25);
        }

        .summary-card-title {
            font-size: 0.72rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #7A6B5C;
            margin-bottom: 4px;
        }

        .summary-card-value {
            font-size: 1.25rem;
            font-weight: 700;
            color: #2B2118;
        }

        .summary-card-value.negativo { color: #B5574A; }
        .summary-card-value.positivo { color: #C89B5E; }
        .summary-card-value.ok { color: #7B9063; }

        /* TAB BAR (ABAS DE FILTRO REAPROVEITADAS) */
        .filter-tabs {
            display: flex;
            gap: 6px;
            background: #E8DFD1;
            padding: 4px;
            border-radius: 12px;
            margin-bottom: 16px;
            overflow-x: auto;
        }

        .tab-btn {
            flex: 1;
            padding: 8px 10px;
            border: none;
            border-radius: 8px;
            background: transparent;
            color: #7A6B5C;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            text-align: center;
            transition: all 0.15s ease;
        }

        .tab-btn.active {
            background: #FFFFFF;
            color: #2B2118;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.06);
        }

        .tab-btn.active.tab-falta { color: #B5574A; }
        .tab-btn.active.tab-sobra { color: #C89B5E; }
        .tab-btn.active.tab-ok { color: #7B9063; }

        /* LISTA DE CARDS DE AUDITORIA DE-PARA */
        .depara-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .depara-card {
            background: #FFFFFF;
            border-radius: 16px;
            padding: 16px 18px;
            box-shadow: 0 4px 16px rgba(43, 33, 24, 0.05);
            border: 1px solid rgba(200, 176, 145, 0.25);
            position: relative;
            width: 100%;
            box-sizing: border-box;
        }

        .depara-card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
            margin-bottom: 8px;
        }

        .depara-sku {
            font-family: var(--font-mono);
            font-size: 0.8rem;
            font-weight: 700;
            color: #A88B65;
            letter-spacing: 0.08em;
        }

        .depara-modelo {
            font-size: 0.98rem;
            font-weight: 600;
            color: #2B2118;
            margin-bottom: 4px;
            line-height: 1.3;
        }

        .depara-badge {
            display: inline-block;
            font-size: 0.75rem;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 20px;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .depara-badge.falta { background: #F4E0DC; color: #B5574A; }
        .depara-badge.sobra { background: #F4E9D4; color: #C89B5E; }
        .depara-badge.ok { background: #E8EFE0; color: #7B9063; }

        .depara-grid-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
            margin-top: 10px;
            table-layout: fixed;
        }

        .depara-grid-table th, .depara-grid-table td {
            width: 33.33%;
            box-sizing: border-box;
        }

        .depara-grid-table th {
            text-align: left;
            color: #7A6B5C;
            padding: 6px 4px;
            border-bottom: 1px solid #F2EBDF;
            font-weight: 600;
        }

        .depara-grid-table td {
            padding: 6px 4px;
            border-bottom: 1px solid #FDFAF5;
            color: #2B2118;
        }

        .diff-tag {
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.8rem;
        }
        .diff-tag.neg { color: #B5574A; background: #F4E0DC; }
        .diff-tag.pos { color: #C89B5E; background: #F4E9D4; }
        .diff-tag.zero { color: #7B9063; background: #E8EFE0; }
        .back-btn-pill, a.back-btn-pill, a.back-btn-pill:visited {
            display: inline-flex !important;
            flex-direction: row !important;
            align-items: center !important;
            justify-content: center !important;
            gap: 6px !important;
            padding: 6px 14px !important;
            background: #FFFFFF !important;
            color: #A88B65 !important;
            border: 1px solid #E8DFD1 !important;
            border-radius: 100px !important;
            font-size: 11px !important;
            font-weight: 700 !important;
            letter-spacing: 0.06em !important;
            text-transform: uppercase !important;
            text-decoration: none !important;
            box-shadow: 0 1px 4px rgba(43, 33, 24, 0.06) !important;
            transition: all 0.2s ease !important;
            white-space: nowrap !important;
            line-height: 1 !important;
        }

        .back-btn-pill svg {
            display: inline-block !important;
            flex-shrink: 0 !important;
            color: #A88B65 !important;
            margin: 0 !important;
        }

        .back-btn-pill:hover {
            border-color: #C8B091 !important;
            background: #FDFAF5 !important;
            color: #2B2118 !important;
        }

        .back-btn-pill:active {
            transform: scale(0.96);
        }
    </style>
</head>
<body>
    <div class="app">
        <header class="app-header">
            <div class="status-bar">
                <a href="/inventario.html" class="back-btn-pill">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="19" y1="12" x2="5" y2="12"></line>
                        <polyline points="12 19 5 12 12 5"></polyline>
                    </svg>
                    Voltar
                </a>
            </div>

            <div class="brand">
                <div class="logo" aria-label="Sonho dos Pés">
                    <img src="assets/logo.svg" alt="Sonho dos Pés" class="logo-img">
                </div>
                <p class="tagline">Auditoria De-Para de Estoque</p>
            </div>
        </header>

        <main class="depara-container">
            <!-- SELETOR DE CONTAGEM CUSTOMIZADO -->
            <div class="session-selector-card">
                <label for="sessionSelect" class="session-select-label">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                        <line x1="16" y1="2" x2="16" y2="6"></line>
                        <line x1="8" y1="2" x2="8" y2="6"></line>
                        <line x1="3" y1="10" x2="21" y2="10"></line>
                    </svg>
                    Comparar Inventário:
                </label>
                <div class="select-wrapper">
                    <select id="sessionSelect" class="session-select">
                        <!-- Preenchido via JS -->
                    </select>
                    <svg class="select-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="6 9 12 15 18 9"></polyline>
                    </svg>
                </div>
            </div>

            <!-- CARDS DE RESUMO (ESPERADO VS CONTADO VS DIVERGÊNCIA) -->
            <div class="summary-grid">
                <div class="summary-card">
                    <div class="summary-card-title">Sistema</div>
                    <div class="summary-card-value" id="valSistema">0</div>
                </div>
                <div class="summary-card">
                    <div class="summary-card-title">Contado</div>
                    <div class="summary-card-value" id="valContado">0</div>
                </div>
                <div class="summary-card">
                    <div class="summary-card-title">Divergência</div>
                    <div class="summary-card-value" id="valDivergencia">0</div>
                </div>
            </div>

            <!-- ABAS DE FILTRO REAPROVEITADAS -->
            <div class="filter-tabs">
                <button class="tab-btn active" data-tab="todos">Todos</button>
                <button class="tab-btn tab-falta" data-tab="faltas">Faltas 🔴</button>
                <button class="tab-btn tab-sobra" data-tab="sobras">Sobras 🟡</button>
                <button class="tab-btn tab-ok" data-tab="ok">Batidos 🟢</button>
            </div>

            <!-- LISTA DE CARDS DE-PARA -->
            <div class="depara-list" id="deparaList">
                <!-- Preenchido via JS -->
            </div>
        </main>
    </div>

    <div class="toast" id="toast" hidden></div>

    <script src="js/depara.js"></script>
</body>
</html>
